name: Deploy to AWS S3 + CloudFront

on:
  push:
    branches:
      - produccion   # 👈 Rama que dispara el deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci
        
      - name: Increment app version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH=$((PATCH+1))
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          npm version $NEW_VERSION --no-git-tag-version
          echo "App version updated to $NEW_VERSION"

      - name: Build project
        run: npm run build

      # ---------- CONFIGURAR AWS ----------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ---------- DEPLOY S3 ----------
      # Diagnóstico temporal de permisos (quitar cuando el deploy funcione)
      - name: Debug AWS identity and bucket
        env:
          BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          echo "== Identidad que usa el workflow =="
          aws sts get-caller-identity --query Arn --output text | sed 's/[0-9]\{12\}/<cuenta>/'
          echo "== Formato del secret S3_BUCKET =="
          echo "largo: ${#BUCKET}"
          [[ "$BUCKET" == s3://* ]] && echo "ERROR: incluye 's3://'"
          [[ "$BUCKET" == */* ]] && echo "ERROR: contiene '/'"
          [[ "$BUCKET" =~ [[:space:]] ]] && echo "ERROR: contiene espacios o salto de línea"
          [[ "$BUCKET" =~ [A-Z] ]] && echo "ERROR: contiene mayúsculas"
          echo "== HeadBucket =="
          aws s3api head-bucket --bucket "$BUCKET" && echo "OK: bucket existe y es accesible" || true
          echo "== ListObjectsV2 =="
          aws s3api list-objects-v2 --bucket "$BUCKET" --max-items 1 --query 'KeyCount' && echo "OK: puede listar" || true

      # 1) Assets con hash en el nombre (dist/assets): caché largo e inmutable.
      #    Se suben primero para que existan antes que el nuevo index.html.
      - name: Upload hashed assets to S3
        run: |
          aws s3 sync dist/assets s3://${{ secrets.S3_BUCKET }}/assets \
            --cache-control "max-age=31536000,public,immutable"

      # 2) Resto (index.html, favicon, logo, sitemap, robots...): sin caché,
      #    para que los navegadores siempre tomen el último deploy.
      - name: Sync HTML and public files to S3
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET }} \
            --delete \
            --exclude "assets/*" \
            --cache-control "no-cache,must-revalidate"

      # 3) Limpia assets antiguos que ya no referencia el nuevo build
      - name: Remove stale assets from S3
        run: |
          aws s3 sync dist/assets s3://${{ secrets.S3_BUCKET }}/assets \
            --delete \
            --cache-control "max-age=31536000,public,immutable"

      # ---------- INVALIDAR CLOUDFRONT ----------
      - name: Create CloudFront invalidation
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
